additional_details: |
  Introduces strongly-typed KeepaliveClientParameters and KeepaliveServerParameters
  structs for configuring gRPC keepalive behavior on both client and server sides.
  Both types include a Validate() method to ensure configuration values are
  non-negative, consistent with other configgrpc types.
