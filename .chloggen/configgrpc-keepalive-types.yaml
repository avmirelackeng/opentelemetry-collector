# A brief description of the change. Surpassing the 80-character limit is allowed.
note: Add KeepaliveClientParameters and KeepaliveServerParameters types with validation

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: []

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
